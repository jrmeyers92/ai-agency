[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    # Enforce HTTPS for 1 year, include subdomains, allow preload registration
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Prevent clickjacking — redundant with CSP frame-ancestors but improves compat with older browsers
    X-Frame-Options = "DENY"

    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"

    # Limit referrer info sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Disable sensitive browser features not used by this site
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

    # Prevent this page from sharing a browsing context group with cross-origin openers
    Cross-Origin-Opener-Policy = "same-origin"

    # Prevent cross-origin reads of this site's resources
    Cross-Origin-Resource-Policy = "same-origin"

    # Content Security Policy
    # Notes:
    #   - 'unsafe-inline' in script-src is required because Astro's View Transitions and
    #     JSON-LD structured data emit inline scripts at build time (no nonce injection on static sites)
    #   - 'unsafe-inline' in style-src is required for Astro's scoped style injection
    #   - worker-src/frame-src blob: is required for Partytown's sandboxed web workers
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://www.google-analytics.com https://analytics.google.com https://www.googletagmanager.com; worker-src 'self' blob:; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
